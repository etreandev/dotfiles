"$schema" = 'https://starship.rs/config-schema.json'

continuation_prompt = '▶▶ '

format = """
[](color_orange)\
$directory\
[](fg:color_orange bg:color_yellow)\
$git_branch\
$git_status\
[](fg:color_yellow bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](bg:color_bg1 fg:color_blue)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

right_format = """
${custom.virtualenv}\
"""
palette = 'monokai_pro_ristretto'

[palettes.monokai_pro_ristretto]
color_fg0 = '#2c2525'
color_bg3 = '#85dacc'
color_bg1 = '#a8a9ed'
color_aqua = '#adda75'
color_blue = '#85dacc'
color_green = '#adda78'
color_orange = '#f38d70'
color_purple = '#a8a9ed'
color_red = '#fd6883'
color_yellow = '#f9cc6c'

[os]
disabled = false
style = "bold bg:color_red fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bold bg:color_red fg:color_fg0"
style_root = "bg:color_red fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "bold fg:color_fg0 bg:color_orange"
format = "[ $path ]($style)"
truncation_length = 2
# truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold bg:color_yellow"
format = '[[ $symbol $branch ](bold fg:color_fg0 bg:color_yellow)]($style)'

[git_status]
use_git_executable = true
style = "bold bg:color_yellow"
format = '[[($all_status$ahead_behind )](bold fg:color_fg0 bg:color_yellow)]($style)'

[nodejs]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[bun]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bold bg:color_blue"
format = '[[ $symbol( $version )](bold fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bold bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_fg0 bg:color_bg3)]($style)'

[conda]
style = "bold bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[pixi]
style = "bold bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bold bg:color_bg1"
format = '[[ Ͳ $time ](bold fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

[custom.virtualenv]
# Grabs the name of the active virtual environment folder
command = "basename \"$VIRTUAL_ENV\""
# Only runs and displays if the $VIRTUAL_ENV variable is set
when = "test -n \"$VIRTUAL_ENV\""
style = "bold fg:color_green bg:color_fg0"
format = '[( \($output\)) (bg:color_fg0 fg:color_green)]($style)'
